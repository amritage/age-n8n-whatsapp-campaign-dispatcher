name: Dispatcher integration checks
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'workflows/**'
      - '.github/workflows/dispatcher-ci.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout new dispatcher repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Javascript syntax
        run: |
          set -e
          for file in src/*.js scripts/*.js tests/*.js; do node --check "$file"; done
      - name: Verify safe workflow JSON
        run: node tests/workflows-safety.test.js
      - name: Check multi-campaign planner
        run: node tests/cycle-planner.test.js
      - name: Check 131049 schedule, analytics and read-only connectivity
        run: node tests/integration-contract.test.js
      - name: Verify provider evidence mapping safeguards
        run: node tests/evidence-mapper.test.js
      - name: Check real EspoCRM field mapping and guarded Chatwoot payload
        run: node tests/campaign-contract.test.js
      - name: Validate manual read-only EspoCRM and Chatwoot probe
        run: node tests/readiness-workflow.test.js
      - name: Check real Chatwoot paginated read-only API adapter
        run: node tests/read-only-reconciliation.test.js
      - name: Check n8n read-only recipient report safety
        run: node tests/recipient-report-workflow.test.js
      - name: Check EspoCRM pagination and safe read-only campaign audit
        run: node tests/espo-audit-readonly.test.js
      - name: Check native community-node workflow operation contracts
        run: node tests/native-community-workflows.test.js
      - name: Run actual Code-node auto-discovery and cross-campaign mapping fixtures
        run: node tests/auto-discovery-runtime.test.js
      - name: Check Chatwoot installed-version compatibility and fail-closed live gate
        run: node tests/chatwoot-compatibility.test.js
      - name: Test 2026 platform research workflow pack without provider writes
        run: node tests/new-platform-workflows.test.js
      - name: Test SQL-free n8n Data Tables pack and double-send prevention boundary
        run: node tests/native-datatable-architecture.test.js
      - name: Adversarial two-perspective release audit (n8n runtime and business policy)
        run: node tests/two-perspective-release-audit.test.js
      - name: Verify merged 6-hour operational health and business-rule safeguards
        run: node tests/merged-health-workflow.test.js
      - name: Validate CSV demo imports match n8n Data Table schema
        run: node tests/demo-datatables-csv.test.js
      - name: Verify canonical Read implies Delivered (no duplicate counts)
        run: node tests/delivery-evidence-core.test.js
      - name: Verify native Chatwoot delivery/Read and failure-code analytics reconciliation
        run: node tests/native-delivery-analytics.test.js
      - name: Test n8n provider evidence reducer subworkflow (no writes)
        run: node tests/delivery-evidence-subworkflow.test.js
      - name: Validate authoritative 22-workflow lifecycle registry and no-live safety
        run: node tests/workflow-lifecycle-manifest.test.js
      - name: Record check results in GitHub Actions summary
        if: always()
        run: |
          {
            echo '## AGE dispatcher automated checks'
            echo
            printf 'Commit: %s\n' "$GITHUB_SHA"
            echo 'Job result: ${{ job.status }}'
            echo
            echo 'Synthetic unit tests only; no production credentials or customer sends.'
            echo 'Details in each step. Long-term state: reports/TEST_LOG.md.'
          } >> "$GITHUB_STEP_SUMMARY"

  postgres-report-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: age_ci
          POSTGRES_PASSWORD: test_only_ci_password
          POSTGRES_DB: age_dispatcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U age_ci -d age_dispatcher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: age_ci
      PGPASSWORD: test_only_ci_password
      PGDATABASE: age_dispatcher_test
    steps:
      - name: Checkout schema
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply reporting schema twice (idempotence)
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/reporting-staging.sql
          psql -v ON_ERROR_STOP=1 -f sql/reporting-staging.sql
      - name: Apply guarded dispatcher PostgreSQL control schema twice
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/dispatcher-control-plane.sql
          psql -v ON_ERROR_STOP=1 -f sql/dispatcher-control-plane.sql
      - name: Assert default denial, 26h gap and missing tier evidence
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO age_dispatcher.portfolio(portfolio_id) VALUES ('test-portfolio');
          DO $age_test$
          DECLARE reason_code text;
          BEGIN
            SELECT reason INTO reason_code FROM age_dispatcher.preflight_view WHERE portfolio_id='test-portfolio';
            IF reason_code <> 'MASTER_DISABLED' THEN
              RAISE EXCEPTION 'Fail-closed default changed: %',reason_code;
            END IF;
          END $age_test$;
          UPDATE age_dispatcher.portfolio SET master_sending_enabled=true,
            operator_live_approved=true,provider_analytics_verified=true,account_health_verified=true,
            messaging_tier=2000,tier_verified_at=now(),quality_verified_at=now(),
            external_usage_verified_at=now(),external_unique_24h=0,unresolved_external_sends=false,
            last_verified_cycle_completed_at=now()-interval '25 hours'
          WHERE portfolio_id='test-portfolio';
          DO $age_test$
          BEGIN
            IF (SELECT reason FROM age_dispatcher.preflight_view WHERE portfolio_id='test-portfolio')
                 <> 'GLOBAL_26_HOUR_GAP' THEN
              RAISE EXCEPTION '26-hour guard not enforced';
            END IF;
          END $age_test$;
          UPDATE age_dispatcher.portfolio SET last_verified_cycle_completed_at=now()-interval '27 hours',
            external_usage_verified_at=now()-interval '25 hours'
          WHERE portfolio_id='test-portfolio';
          DO $age_test$
          BEGIN
            IF (SELECT reason FROM age_dispatcher.preflight_view WHERE portfolio_id='test-portfolio')
                 <> 'EXTERNAL_USAGE_UNKNOWN_OR_STALE' THEN
              RAISE EXCEPTION 'External usage freshness not enforced';
            END IF;
            IF (SELECT can_send FROM age_dispatcher.preflight_view WHERE portfolio_id='test-portfolio') THEN
              RAISE EXCEPTION 'Read-only preflight must NEVER authorize sends';
            END IF;
          END $age_test$;
          SQL
      - name: Verify recipient report constraints with synthetic IDs
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO age_campaign_reporting.batch
          (batch_id,espo_campaign_id,chatwoot_account_id,chatwoot_campaign_display_id,expected_recipients)
          VALUES ('synthetic-batch','synthetic-crm-campaign',2,100,2);
          INSERT INTO age_campaign_reporting.recipient_status
          (batch_id,chatwoot_contact_id,espo_recipient_id,status,error_code)
          VALUES ('synthetic-batch',1001,'synthetic-recipient-1','delivered',null);
          INSERT INTO age_campaign_reporting.recipient_status
          (batch_id,chatwoot_contact_id,espo_recipient_id,status,error_code)
          VALUES ('synthetic-batch',1002,'synthetic-recipient-2','failed','131049');
          DO $$
          BEGIN
            IF (SELECT count(*) FROM age_campaign_reporting.recipient_status WHERE batch_id='synthetic-batch') <> 2 THEN
              RAISE EXCEPTION 'Reporting projection persistence failed';
            END IF;
          END $$;
          SQL

  n8n-import-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout workflow files
        uses: actions/checkout@v4
      - name: Import all workflow JSON files into disposable n8n 2.37.9
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/workflows:/workflows:ro" \
            -e N8N_ENCRYPTION_KEY=ci_dummy_key_never_used_in_prod \
            n8nio/n8n:2.37.9 \
            import:workflow --separate --input=/workflows
      - name: Report import success
        if: success()
        run: echo "All repository workflows imported into disposable n8n 2.37.9 (not executed)." >> "$GITHUB_STEP_SUMMARY"
