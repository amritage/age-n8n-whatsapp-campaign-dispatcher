name: Dispatcher integration checks
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'workflows/**'
      - '.github/workflows/dispatcher-ci.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout new dispatcher repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Javascript syntax
        run: |
          set -e
          for file in src/*.js scripts/*.js tests/*.js; do node --check "$file"; done
      - name: Verify safe workflow JSON
        run: node tests/workflows-safety.test.js
      - name: Check multi-campaign planner
        run: node tests/cycle-planner.test.js
      - name: Check 131049 schedule, analytics and read-only connectivity
        run: node tests/integration-contract.test.js
      - name: Verify provider evidence mapping safeguards
        run: node tests/evidence-mapper.test.js
      - name: Check real EspoCRM field mapping and guarded Chatwoot payload
        run: node tests/campaign-contract.test.js
      - name: Validate manual read-only EspoCRM and Chatwoot probe
        run: node tests/readiness-workflow.test.js
      - name: Record check results in GitHub Actions summary
        if: always()
        run: |
          {
            echo '## AGE dispatcher automated checks'
            echo
            printf 'Commit: %s\n' "$GITHUB_SHA"
            echo 'Job result: ${{ job.status }}'
            echo
            echo 'Synthetic unit tests only; no production credentials or customer sends.'
            echo 'Details in each step. Long-term state: reports/TEST_LOG.md.'
          } >> "$GITHUB_STEP_SUMMARY"
